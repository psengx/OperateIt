syntax = "proto3";

option csharp_namespace = "ProductService.Grpc";

package products;

service ProductGrpc {
  rpc AcceptReception (ReceptionRequest) returns (ReceptionReply);
}

message ReceptionRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ReceptionReply {
  bool success = 1;
  int32 new_stock = 2;
  string message = 3;
}